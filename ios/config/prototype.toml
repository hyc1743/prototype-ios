# PROTOTYPE / Nintendo Switch - 1.0.0 (free, t.me/fspores)
# ReXGlue port; SDK masseffect-nx + prototype2-nx patch; native renderer from prototype2-nx (penettrator).
# The engine's English slot is localized to Chinese by bundled text/font edits.
# The underlying resources-v1 archives are left intact (their original text is PT-BR).
# Chinese requires matching translated game resources, not only a locale ID.
p2_renderer = "native"
render_target_path_vulkan = "fsi"
user_language = 1

# Keep guest requests paced, instead of releasing several on one device pull.
audio_maxqframes = 8
audio_sdl_pump = true

# Native renderer: the values Prototype 2 0.1.0 ships with (same engine).
p2_native_msaa = false
p2_native_record_thread = true
p2_native_async_pipelines = true
p2_native_pipeline_prewarm = true
p2_min_frame_vblanks = 1
# Wait before handing a frame to the presentation queue. This keeps bursts of
# late submissions from turning into alternating long and short frames.
p2_pace_before_present = false
p2_native_depth24 = true
gpu_specialize_texture_signs = true
p2_native_copy_specialization = true
p2_native_depth_words_direct = true
p2_native_structured_jumps = true
p2_native_edram_depth_alias_clear = true
p2_native_resolve_xenia_pack = true
p2_native_binding_revalidate = true
p2_native_dynamic_buffer_upload = true
p2_native_sampled_stable_ranges = true
p2_native_sampled_min_bytes = 16384
p2_native_max_anisotropy = 1
p2_native_texture_lod_bias = 1.0
# Reuse device memory for streaming textures and keep recently used material
# textures resident. This avoids allocation/upload spikes during movement.
p2_native_texture_pool = 64
p2_native_texture_cache_mb = 64
p2_native_async_present = false
# Use the renderer's existing compatibility result path for guest occlusion.
p2_native_occlusion_queries = false
# Apple full-screen vertex arithmetic compatibility.
proto_apple_relax_post_vertex = true
# Keep the native iOS draw batch at the last known playable size while checking
# the scene-loss regression reported after native-dev.7.
proto_apple_draw_batch = 128
# Render the game at a bounded internal size and let the existing FSR present
# pass scale it to the device. This lowers fragment work while keeping the
# 1280x720 game coordinate system and UI layout.
proto_render_width = 960
proto_render_height = 544
present_effect = "fsr"
# Prototype 2 specific skips are off: they were matched to its passes, not to Prototype 1's.
p2_native_skip_depth_prepass = false
p2_native_reflection_half_rate = false
p2_native_skin_unique = false

# Threads and cores (three cores; core 3 only with a forwarder that allows it).
proto_msr_lock_mode = 1
p2_guest_priorities = false
p2_guest_affinity = false
p2_host_core_mask = 6
p2_main_thread_priority = 58
p2_main_thread_mask = 14
p2_guest_core_mask = 15
p2_audio_core_mask = 8
proto_render_thread_priority = 57

# Logs: warnings only.
log_level = "warn"
log_flush_level = "warn"
p2_frame_diagnostics = false
vulkan_validation_enabled = false

# Apple/MoltenVK capability selection; retain validation of all required shader features.
vulkan_require_geometry_shader = false
vulkan_require_fill_mode_non_solid = false
