name: Observe source-native game on macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-macos-source-probe
  cancel-in-progress: false

jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: native-capture
            renderer: native
            extra: --debug-raster 0
          - variant: native-no-depth-cull
            renderer: native
            extra: --debug-raster 3
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.tools/ccache-macos
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 3G
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare tools
        run: |
          brew install cmake ninja ccache spirv-tools
          python -m pip install -r requirements.txt
      - name: Check Apple rendering regressions
        run: python -m unittest discover -s tests -p test_apple_native_fixes.py
      - uses: actions/cache/restore@v4
        with:
          path: |
            .tools/source-port/git-cache
            .tools/ccache-macos
          key: prototype-macos-source-v1-${{ runner.arch }}-${{ github.sha }}-${{ matrix.variant }}-${{ github.run_attempt }}
          restore-keys: |
            prototype-macos-source-v1-${{ runner.arch }}-
      - name: Authenticate translated game source
        env:
          PROTOTYPE_CODEGEN_KEY: ${{ secrets.PROTOTYPE_CODEGEN_KEY }}
        run: python tools/ci_codegen.py open ci-inputs/codegen.enc "$RUNNER_TEMP/prototype-codegen"
      - name: Fetch reviewed original source
        run: |
          git init references/prototype-switch
          git -C references/prototype-switch fetch --depth 1 https://github.com/fungalspores/prototype-switch.git 292de4b382dbe335011d8b4f56ec4212df5ef74c
          git -C references/prototype-switch checkout --detach FETCH_HEAD
      - name: Compile and observe with verified resources
        run: python tools/mac_source_probe.py --generated "$RUNNER_TEMP/prototype-codegen" --download-parts --renderer ${{ matrix.renderer }} ${{ matrix.extra }}
      - name: Seal private shader observations
        if: always()
        env:
          PROTOTYPE_CODEGEN_KEY: ${{ secrets.PROTOTYPE_CODEGEN_KEY }}
        run: python tools/seal_probe_evidence.py out/mac-source-probe/private/spirv out/mac-source-probe/evidence/shaders.enc
      - name: Upload observations and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Prototype-macOS-source-observation-${{ matrix.variant }}
          path: out/mac-source-probe/evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Remove decrypted source and restored resources
        if: always()
        run: |
          python -c 'import os,pathlib,shutil; shutil.rmtree(pathlib.Path(os.environ["RUNNER_TEMP"])/"prototype-codegen",ignore_errors=True); shutil.rmtree("out/mac-source-probe/private",ignore_errors=True)'
      - name: Record compiler cache statistics
        if: always()
        run: ccache --show-stats --verbose
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .tools/source-port/git-cache
            .tools/ccache-macos
          key: prototype-macos-source-v1-${{ runner.arch }}-${{ github.sha }}-${{ matrix.variant }}-${{ github.run_attempt }}
